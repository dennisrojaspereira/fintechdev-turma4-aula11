# Lab 2 — TechPix AI Assistant (stack 100% local, dados ficticios)
#
# Sobe: Postgres+pgvector (RAG), Langfuse v2 (observabilidade) e Langflow (fluxo visual).
# O Ollama roda NO HOST (instalacao nativa aproveita a GPU) — ver chatbot/README.md.
#
# Nota: usamos Langfuse v2 porque roda apenas com Postgres. A v3 exige tambem
# ClickHouse, Redis e MinIO (nao "basta um container") — ver chatbot/README.md.
#
# Credenciais abaixo sao placeholders de desenvolvimento LOCAL, sobreponiveis
# via .env (copie .env.example). Nunca use em qualquer ambiente real.

name: techpix-lab2

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techpix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpix-local-dev}
      POSTGRES_DB: techpix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techpix} -d techpix"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-techpix}:${POSTGRES_PASSWORD:-techpix-local-dev}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-nextauth-secret}
      SALT: ${LANGFUSE_SALT:-local-dev-salt}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    mem_limit: 1536m

  langflow:
    image: langflowai/langflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7860:7860"
    environment:
      LANGFLOW_DATABASE_URL: postgresql://${POSTGRES_USER:-techpix}:${POSTGRES_PASSWORD:-techpix-local-dev}@postgres:5432/langflow
      LANGFLOW_AUTO_LOGIN: "true"
      DO_NOT_TRACK: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Langflow -> Ollama do host
    mem_limit: 2g

volumes:
  pgdata:
