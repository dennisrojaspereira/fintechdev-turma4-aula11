<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula 11 — Tour TechPix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/gherkin.min.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#141824; --panel2:#1b2130; --border:#272e40;
    --text:#e9ecf5; --muted:#8c94aa; --accent:#5b9dff; --accent2:#9d7bff;
    --ok:#3ecf8e; --bad:#ff6b6b; --code:#10131c;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:
    radial-gradient(1100px 500px at 85% -10%, #18223d 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #1c1430 0%, transparent 55%),
    var(--bg);
    color:var(--text);display:flex;height:100vh;overflow:hidden}

  /* barra de progresso */
  #progresso{position:fixed;top:0;left:0;height:4px;z-index:50;width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .45s cubic-bezier(.22,1,.36,1);border-radius:0 3px 3px 0;
    box-shadow:0 0 12px rgba(91,157,255,.8)}

  nav{width:290px;min-width:290px;background:rgba(20,24,36,.92);backdrop-filter:blur(6px);
    border-right:1px solid var(--border);overflow-y:auto;padding:16px 12px;z-index:10}
  nav h1{font-size:12px;margin:6px 10px 16px;color:var(--muted);font-weight:700;letter-spacing:1.2px}
  nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
    border:0;color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;
    margin-bottom:2px;line-height:1.3;transition:all .18s}
  nav button:hover{background:var(--panel2);color:var(--text);transform:translateX(3px)}
  nav button.ativo{background:linear-gradient(90deg,rgba(91,157,255,.18),rgba(157,123,255,.10));
    color:#fff;font-weight:600;border-left:3px solid var(--accent)}
  nav button.visto .num{background:var(--ok);color:#06241a}
  nav .num{min-width:22px;height:22px;border-radius:7px;background:var(--panel2);
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;
    font-weight:700;color:var(--muted);transition:all .2s}
  nav button.ativo .num{background:var(--accent);color:#fff}

  main{flex:1;overflow-y:auto;padding:46px 56px 110px;position:relative}
  .slide{max-width:1000px;margin:0 auto}

  /* animações de entrada */
  @keyframes sobe{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes desliza{from{opacity:0;transform:translateX(var(--dx,40px))}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.85) translateY(14px)}100%{opacity:1;transform:none}}
  .anim{opacity:0;animation:sobe .6s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--d,0s)}
  .slide-titulo{opacity:0;animation:desliza .55s cubic-bezier(.22,1,.36,1) forwards}

  .kicker{font-size:12px;letter-spacing:2.5px;color:var(--accent);font-weight:700;margin-bottom:6px}
  h2.hero{font-size:40px;margin:0 0 18px;line-height:1.15;
    background:linear-gradient(90deg,#fff 30%,#aebcf5);-webkit-background-clip:text;
    background-clip:text;color:transparent}

  .expl{font-size:17px;line-height:1.7}
  .expl h2{font-size:21px;margin-top:24px;color:var(--accent)}
  .expl strong{color:#fff}
  .expl code{background:var(--code);padding:2px 7px;border-radius:6px;font-size:.88em;color:#9ecbff}
  .expl ul{padding-left:22px}
  .expl li{margin:6px 0}

  /* cards de tecnologia */
  .techs{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin:26px 0 6px}
  .tech{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);
    border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;
    opacity:0;animation:pop .5s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--d,0s);
    transition:transform .2s, border-color .2s, box-shadow .2s}
  .tech:hover{transform:translateY(-4px) scale(1.02);border-color:var(--accent);
    box-shadow:0 10px 28px rgba(91,157,255,.18)}
  .tech .ico{font-size:28px;filter:drop-shadow(0 2px 8px rgba(91,157,255,.35))}
  .tech b{display:block;font-size:14.5px}
  .tech span{font-size:12px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}

  .secao{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;margin:30px 0 10px}

  /* janelas de código estilo editor */
  .codecard{background:var(--code);border:1px solid var(--border);border-radius:13px;
    margin:14px 0;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .codecard header{display:flex;align-items:center;gap:8px;background:var(--panel);
    border-bottom:1px solid var(--border);padding:9px 14px;cursor:pointer;user-select:none}
  .dots{display:flex;gap:6px}
  .dots i{width:11px;height:11px;border-radius:50%}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .codecard header .fname{font-family:Consolas,monospace;font-size:13px;color:#b9c4e4;margin-left:6px}
  .codecard header .lang{margin-left:auto;font-size:10.5px;letter-spacing:1px;color:var(--muted);
    border:1px solid var(--border);border-radius:20px;padding:2px 10px;text-transform:uppercase}
  .codecard header .chev{color:var(--muted);transition:transform .25s;font-size:12px}
  .codecard.aberto header .chev{transform:rotate(90deg)}
  .codecard .corpo{display:none}
  .codecard.aberto .corpo{display:block;animation:sobe .35s ease forwards}
  .codecard pre{margin:0;padding:16px 18px;overflow:auto;max-height:480px;font-size:13px;line-height:1.55}
  .codecard pre code{background:transparent;padding:0;font-family:Consolas,"Cascadia Code",monospace}
  .codecard .mdview{padding:18px 22px;font-size:14.5px;line-height:1.65;max-height:480px;overflow:auto}
  .mdview h1,.mdview h2{color:var(--accent);font-size:1.2em}
  .mdview table{border-collapse:collapse;margin:10px 0;font-size:13px}
  .mdview th,.mdview td{border:1px solid var(--border);padding:5px 10px}
  .mdview code{background:#1a2030;padding:1px 6px;border-radius:5px;font-size:.88em;color:#9ecbff}

  /* ações ao vivo */
  .acao{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);
    border-radius:14px;padding:16px;margin:13px 0}
  .acao > button{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;
    border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;
    transition:transform .15s, box-shadow .2s;box-shadow:0 6px 20px rgba(91,157,255,.25)}
  .acao > button:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(91,157,255,.4)}
  .acao > button:disabled{opacity:.55;cursor:wait;transform:none}
  .dica{margin-left:10px;color:var(--muted);font-size:12.5px}
  .saida{display:none;margin-top:14px;background:var(--code);border-radius:10px;
    font-family:Consolas,monospace;font-size:12.5px;line-height:1.55;overflow:hidden}
  .saida .bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);
    border-bottom:1px solid var(--border);font-family:inherit;font-size:11px;letter-spacing:1px;color:var(--muted)}
  .saida .badge{border-radius:20px;padding:2px 10px;font-weight:700}
  .saida .badge.run{background:#333c55;color:#cfd8f5}
  .saida .badge.ok{background:rgba(62,207,142,.18);color:var(--ok)}
  .saida .badge.bad{background:rgba(255,107,107,.15);color:var(--bad)}
  .saida pre{margin:0;padding:14px;white-space:pre-wrap;max-height:460px;overflow-y:auto}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--accent);
    animation:pisca 1s steps(2) infinite;vertical-align:middle}
  @keyframes pisca{50%{opacity:0}}

  .rodape{position:fixed;bottom:0;left:290px;right:0;background:rgba(20,24,36,.92);
    backdrop-filter:blur(6px);border-top:1px solid var(--border);
    padding:11px 56px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .rodape button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:9px 22px;cursor:pointer;font-size:14px;transition:all .15s}
  .rodape button:hover{border-color:var(--accent);transform:translateY(-1px)}
  .rodape button.prox{background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;font-weight:700}
  #pos{color:var(--muted);font-size:13px;letter-spacing:1px}
  kbd{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 6px;font-size:11px;font-family:Consolas,monospace}
  @media (max-width:820px){nav{display:none}.rodape{left:0;padding:11px 16px}main{padding:24px 18px 100px}h2.hero{font-size:28px}}
</style>
</head>
<body>
<div id="progresso"></div>
<nav id="menu"><h1>AULA 11 · ENGENHARIA COM AGENTES DE IA</h1></nav>
<main><div class="slide" id="conteudo"></div></main>
<div class="rodape">
  <button onclick="navegar(-1)">← Anterior</button>
  <span id="pos"></span>
  <span>
    <span style="color:var(--muted);font-size:12px;margin-right:12px"><kbd>←</kbd><kbd>→</kbd> navegar · <kbd>N</kbd> notas</span>
    <button onclick="abrirNotas()" title="Notas do apresentador em outra janela">🗒 Notas</button>
    <button class="prox" onclick="navegar(1)">Próximo →</button>
  </span>
</div>
<script>
let passos = [], atual = 0, direcao = 1;
let canal = null;
try { canal = new BroadcastChannel('tour'); } catch(e) {}

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LINGUAS = {py:'python', yml:'yaml', yaml:'yaml', json:'json', feature:'gherkin',
                 html:'xml', toml:'ini', sql:'sql', ps1:'powershell', sh:'bash'};

function sincronizar(i){
  try { localStorage.setItem('tour-passo', i); } catch(e) {}
  if (canal) canal.postMessage(i);
}
function abrirNotas(){ window.open('/notas', 'tour-notas', 'width=760,height=900'); }

async function init(){
  passos = await (await fetch('/api/steps')).json();
  const menu = document.getElementById('menu');
  passos.forEach((p,i)=>{
    const b = document.createElement('button');
    b.innerHTML = `<span class="num">${i+1}</span><span>${p.titulo.replace(/^\d+\.\s*/,'')}</span>`;
    b.onclick = ()=>{ direcao = i>atual?1:-1; mostrar(i); };
    b.id = 'nav'+i; menu.appendChild(b);
  });
  mostrar(0);
}

function navegar(d){ direcao = d; mostrar(Math.min(Math.max(atual+d,0),passos.length-1)); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown') navegar(1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') navegar(-1);
  if(e.key==='n'||e.key==='N') abrirNotas();
});

function mostrar(i){
  atual = i; sincronizar(i);
  const p = passos[i];
  document.querySelectorAll('nav button').forEach((b,j)=>{
    b.classList.toggle('ativo', j===i);
    if(j<i) b.classList.add('visto');
  });
  document.getElementById('pos').textContent = `${i+1} / ${passos.length}`;
  document.getElementById('progresso').style.width = ((i+1)/passos.length*100)+'%';

  // separa o titulo "N. Nome" em kicker + hero
  const nome = p.titulo.replace(/^\d+\.\s*/,'');
  // tira o primeiro h2 da explicacao para virar hero
  let md = p.explicacao.trim();
  let hero = nome;
  const m = md.match(/^##\s+(.+)\n/);
  if(m){ hero = m[1]; md = md.slice(m[0].length); }

  let delay = 0.05;
  const d = () => `style="--d:${(delay+=0.09).toFixed(2)}s"`;

  let html = `
    <div class="slide-titulo" style="--dx:${direcao*46}px">
      <div class="kicker">PASSO ${i+1} · ${nome.toUpperCase()}</div>
      <h2 class="hero">${hero}</h2>
    </div>
    <div class="expl anim" ${d()}>${marked.parse(md)}</div>`;

  if(p.tecnologias && p.tecnologias.length){
    html += `<div class="secao anim" ${d()}>TECNOLOGIAS DESTE PASSO</div><div class="techs">`;
    p.tecnologias.forEach(t=>{
      html += `<div class="tech" ${d()}><span class="ico">${t.icone}</span>
               <span><b>${t.nome}</b><span>${t.desc}</span></span></div>`;
    });
    html += `</div>`;
  }

  if(p.arquivos.length){
    html += `<div class="secao anim" ${d()}>CÓDIGO & DOCUMENTOS</div>`;
    p.arquivos.forEach((a,j)=>{
      const ext = a.split('.').pop();
      html += `<div class="codecard anim ${j===0?'aberto':''}" ${d()} id="arq${j}" data-path="${a}" data-ext="${ext}">
        <header onclick="toggleCard(${j})">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="fname">${a}</span>
          <span class="lang">${ext==='md'?'markdown':(LINGUAS[ext]||ext)}</span>
          <span class="chev">▶</span>
        </header>
        <div class="corpo"><pre><code>carregando…</code></pre></div>
      </div>`;
    });
  }

  if(p.acoes.length){
    html += `<div class="secao anim" ${d()}>▶ AO VIVO — EXECUTA DE VERDADE NESTA MÁQUINA</div>`;
    p.acoes.forEach(a=>{
      html += `<div class="acao anim" ${d()}>
        <button onclick="rodar('${a.id}', this)">${a.label}</button>
        ${a.demorado ? '<span class="dica">pode levar de segundos a ~1 min</span>' : ''}
        <div class="saida" id="out-${a.id}">
          <div class="bar"><span class="badge run">EXECUTANDO</span><span class="rotulo">${a.label.replace(/^\S+\s/,'')}</span></div>
          <pre></pre>
        </div></div>`;
    });
  }

  const main = document.getElementById('conteudo');
  main.innerHTML = html;
  document.querySelector('main').scrollTop = 0;
  if(p.arquivos.length) carregarArquivo(0);  // primeiro arquivo já aberto
}

function toggleCard(j){
  const card = document.getElementById('arq'+j);
  card.classList.toggle('aberto');
  if(card.classList.contains('aberto')) carregarArquivo(j);
}

async function carregarArquivo(j){
  const card = document.getElementById('arq'+j);
  if(!card || card.dataset.carregado==='1') return;
  card.dataset.carregado='1';
  const r = await fetch('/api/file?path='+encodeURIComponent(card.dataset.path));
  const dados = await r.json();
  const corpo = card.querySelector('.corpo');
  const ext = card.dataset.ext;
  if(ext==='md'){
    corpo.innerHTML = `<div class="mdview">${marked.parse(dados.conteudo||'')}</div>`;
  }else{
    const lang = LINGUAS[ext];
    corpo.innerHTML = `<pre><code class="${lang?('language-'+lang):''}">${esc(dados.conteudo||dados.detail||'')}</code></pre>`;
    const bloco = corpo.querySelector('code');
    try{ hljs.highlightElement(bloco); }catch(e){}
  }
}

async function rodar(id, btn){
  const out = document.getElementById('out-'+id);
  const badge = out.querySelector('.badge');
  const pre = out.querySelector('pre');
  btn.disabled = true;
  out.style.display = 'block';
  badge.className = 'badge run'; badge.textContent = 'EXECUTANDO';
  pre.innerHTML = '$ executando de verdade nesta máquina… <span class="cursor"></span>';
  try{
    const r = await fetch('/api/run/'+id, {method:'POST'});
    const dados = await r.json();
    pre.textContent = dados.output || JSON.stringify(dados);
    badge.className = 'badge ' + (dados.ok ? 'ok' : 'bad');
    badge.textContent = dados.ok ? '✓ SUCESSO' : '✗ FALHOU';
  }catch(e){
    pre.textContent = 'Erro: '+e;
    badge.className = 'badge bad'; badge.textContent = '✗ ERRO';
  }
  btn.disabled = false;
}
init();
</script>
</body>
</html>
